[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lsst-aot"
version = "0.0.1"
description = "Tests and exploratory scripts for LSST/Rubin alerts and active small bodies"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "astropy",
]

[tool.setuptools.packages.find]
where = ["src"]
